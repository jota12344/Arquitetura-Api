openapi: 3.0.3
info:
  title: Arquitetura API
  version: 1.0.0
  description: 'API REST de produtos e categorias. Contrato revisado a partir das rotas, Requests, Resources e testes.
    Exemplos são fictícios e não são fixtures do banco. Consultas de produtos e categorias são públicas; escrita
    exige token Sanctum e edição/exclusão exigem propriedade. Cabeçalhos recomendados: Accept: application/json
    e Content-Type: application/json nos corpos. Erros da API são JSON mesmo sem Accept. O middleware normalmente
    adiciona X-Request-ID e X-Response-Time; falhas anteriores à execução dele podem não conter esses cabeçalhos.
    Rotas GET também aceitam HEAD sem corpo, conforme o roteamento Laravel. Não há PATCH, cadastro de usuários ou
    escrita de categorias. Tokens são opacos, não JWT, e a configuração atual não define expiração global.'
servers:
- url: http://localhost:8082/api
  description: Desenvolvimento local; ajuste se APP_PORT mudar.
tags:
- name: Autenticação
- name: Produtos
- name: Categorias
security: []
paths:
  /login:
    post:
      summary: Autenticar um usuário existente
      tags:
      - Autenticação
      operationId: login
      responses:
        '200':
          description: Login realizado; utilize token no cabeçalho Authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 'Credenciais incorretas retornam 422, com erro associado a email. Não existe endpoint de cadastro
        de usuários. Limite adicional: 5 requisições/minuto por IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /logout:
    post:
      summary: Revogar o token da requisição atual
      tags:
      - Autenticação
      operationId: logout
      responses:
        '200':
          description: Logout concluído; outros tokens permanecem válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Logout realizado com sucesso.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - bearerAuth: []
  /user:
    get:
      summary: Consultar o usuário autenticado
      tags:
      - Autenticação
      operationId: currentUser
      responses:
        '200':
          description: Objeto do usuário, sem envelope data, senha ou remember_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: Usuário de exemplo
                email: usuario@example.test
                email_verified_at: null
                created_at: '2026-10-01T12:00:00.000000Z'
                updated_at: '2026-10-01T12:00:00.000000Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - bearerAuth: []
  /products:
    get:
      summary: Listar e filtrar produtos
      tags:
      - Produtos
      operationId: listProducts
      responses:
        '200':
          description: Lista pública, dez produtos por página, ID decrescente. Links preservam filtros validados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                data:
                - id: 1
                  name: Mouse Gamer
                  price: 150
                  category_id: 1
                  category:
                    id: 1
                    name: Informática
                links:
                  first: http://localhost:8082/api/products?page=1
                  last: http://localhost:8082/api/products?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  links:
                  - url: null
                    label: '&laquo; Previous'
                    active: false
                  - url: http://localhost:8082/api/products?page=1
                    label: '1'
                    active: true
                  - url: null
                    label: Next &raquo;
                    active: false
                  path: http://localhost:8082/api/products
                  per_page: 10
                  to: 1
                  total: 1
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: name
        in: query
        description: Busca parcial com LIKE %nome%. % e _ seguem os curingas SQL. Sensibilidade a maiúsculas e acentos
          depende da collation do banco.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: min_price
        in: query
        description: Preço mínimo inclusivo; zero é aceito.
        schema:
          type: number
          minimum: 0
      - name: max_price
        in: query
        description: Preço máximo inclusivo; se min_price estiver presente, deve ser maior ou igual a ele.
        schema:
          type: number
          minimum: 0
      - name: category_id
        in: query
        description: ID de categoria existente; inválida ou inexistente retorna 422.
        schema: &id004
          type: integer
          format: int64
      - &id002
        $ref: '#/components/parameters/Page'
      description: Filtros combinados por AND. Parâmetros presentes e vazios são inválidos. Sem resultados ou página
        além da última retorna 200 com data vazio. Os limites de preço dos filtros exigem numeric/min:0; não têm
        a restrição de duas casas do cadastro.
    post:
      summary: Criar um produto
      tags:
      - Produtos
      operationId: createProduct
      responses:
        '201':
          description: Produto criado e associado ao usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResult'
              example:
                data: &id001
                  id: 1
                  name: Mouse Gamer
                  price: '150.00'
                  category_id: 1
                  category:
                    id: 1
                    name: Informática
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - bearerAuth: []
      description: user_id enviado no corpo é ignorado; o proprietário é definido pela autenticação. Sem category_id,
        cria um produto sem categoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example:
              name: Mouse Gamer
              price: 150
              category_id: 1
  /products/{id}:
    parameters:
    - &id003
      $ref: '#/components/parameters/Id'
    get:
      summary: Consultar um produto
      tags:
      - Produtos
      operationId: showProduct
      responses:
        '200':
          description: Consulta pública com categoria carregada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResult'
              example:
                data:
                  id: 1
                  name: Mouse Gamer
                  price: 150
                  category_id: 1
                  category:
                    id: 1
                    name: Informática
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Atualizar um produto próprio
      tags:
      - Produtos
      operationId: updateProduct
      responses:
        '200':
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResult'
              example:
                data: *id001
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - bearerAuth: []
      description: 'name e price são obrigatórios, inclusive na atualização. category_id omitido preserva a associação;
        null remove. user_id não transfere a propriedade. A validação do corpo precede a consulta/autorização: corpo
        inválido pode retornar 422 mesmo para produto inexistente ou de terceiros.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            examples:
              associar:
                value:
                  name: Mouse Gamer
                  price: 150
                  category_id: 1
              removerCategoria:
                value:
                  name: Mouse Gamer
                  price: 150
                  category_id: null
    delete:
      summary: Excluir um produto próprio
      tags:
      - Produtos
      operationId: deleteProduct
      responses:
        '204':
          description: Produto excluído. Resposta sem corpo.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
      - bearerAuth: []
  /categories:
    get:
      summary: Listar categorias
      tags:
      - Categorias
      operationId: listCategories
      responses:
        '200':
          description: Lista pública, dez categorias por página, ID crescente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
              example:
                data:
                - id: 1
                  name: Informática
                links:
                  first: http://localhost:8082/api/categories?page=1
                  last: http://localhost:8082/api/categories?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  links:
                  - url: null
                    label: '&laquo; Previous'
                    active: false
                  - url: http://localhost:8082/api/categories?page=1
                    label: '1'
                    active: true
                  - url: null
                    label: Next &raquo;
                    active: false
                  path: http://localhost:8082/api/categories
                  per_page: 10
                  to: 1
                  total: 1
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id002
  /categories/{id}:
    parameters:
    - *id003
    get:
      summary: Consultar uma categoria
      tags:
      - Categorias
      operationId: showCategory
      responses:
        '200':
          description: Categoria sem lista aninhada de produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResult'
              example:
                data:
                  id: 1
                  name: Informática
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco do Laravel Sanctum retornado por POST /login; informe somente o token no botão Authorize.
  parameters:
    Page:
      name: page
      in: query
      description: Inteiro positivo. Tamanho fixo de dez registros.
      schema:
        type: integer
        minimum: 1
        default: 1
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico do recurso.
      schema: *id004
  schemas:
    Category:
      type: object
      properties: &id005
        id: *id004
        name:
          type: string
          maxLength: 255
      required: &id006
      - id
      - name
    NullableCategory:
      type: object
      properties: *id005
      required: *id006
      nullable: true
    Product:
      type: object
      properties:
        id: *id004
        name:
          type: string
          maxLength: 255
        price:
          anyOf:
          - type: string
          - type: number
          description: 'Sem cast no Model: normalmente string decimal no MySQL; pode ser número no SQLite.'
        category_id:
          type: integer
          format: int64
          nullable: true
        category:
          $ref: '#/components/schemas/NullableCategory'
      required:
      - id
      - name
      - price
      - category_id
      - category
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Obrigatório; espaços externos são removidos. Nome vazio ou apenas espaços é inválido.
        price:
          description: De 0 a 99999999.99, até duas casas decimais. Strings em notação científica são rejeitadas.
            Valores numéricos são validados após decodificação JSON.
          anyOf:
          - type: number
            minimum: 0
            maximum: 99999999.99
            multipleOf: 0.01
          - type: string
            pattern: ^0*[0-9]{1,8}(\.[0-9]{1,2})?$
        category_id:
          type: integer
          format: int64
          nullable: true
          description: 'Categoria existente. Opcional: omitida na atualização preserva a associação; null remove
            a associação.'
      required:
      - name
      - price
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
          example: null
        last:
          type: string
          nullable: true
          example: null
        prev:
          type: string
          nullable: true
          example: null
        next:
          type: string
          nullable: true
          example: null
      required:
      - first
      - last
      - prev
      - next
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
          minimum: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
                example: null
              label:
                type: string
              active:
                type: boolean
            required:
            - url
            - label
            - active
        path:
          type: string
        per_page:
          type: integer
          enum:
          - 10
        to:
          type: integer
          nullable: true
        total:
          type: integer
          minimum: 0
      required:
      - current_page
      - from
      - last_page
      - links
      - path
      - per_page
      - to
      - total
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
      - errors
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        message:
          type: string
          example: Login realizado com sucesso.
        token:
          type: string
          description: Token opaco retornado somente no login. Nenhum token real é incluído nesta documentação.
        token_type:
          type: string
          enum:
          - Bearer
      required:
      - message
      - token
      - token_type
    User:
      type: object
      properties:
        id: *id004
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
      - email
      - email_verified_at
      - created_at
      - updated_at
    ProductResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
      required:
      - data
    ProductPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - links
      - meta
    CategoryResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Category'
      required:
      - data
    CategoryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - links
      - meta
  responses:
    Unauthenticated:
      description: Token ausente, inválido, expirado ou revogado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Usuário autenticado não é o proprietário do produto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: This action is unauthorized.
    Validation:
      description: Dados inválidos. As mensagens dependem da validação e do idioma configurado; errors identifica
        os campos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The price field is required.
            errors:
              price:
              - The price field is required.
    ProductNotFound:
      description: Produto inexistente; identificadores não numéricos não correspondem à rota e retornam 404 genérico.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Produto não encontrado.
    CategoryNotFound:
      description: Categoria inexistente; identificadores não numéricos retornam 404 genérico.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Categoria não encontrada.
    InternalError:
      description: Erro inesperado. Com APP_DEBUG=false, detalhes internos não são expostos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Server Error
    TooManyRequests:
      description: 'Limite excedido: geral de 60 requisições/minuto por usuário ou IP; login também tem limite de
        5/minuto por IP.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Too Many Attempts.
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa.
          schema:
            type: integer
